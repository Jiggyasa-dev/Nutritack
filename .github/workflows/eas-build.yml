name: Build Android APK

on:
  workflow_dispatch:   # manual trigger button on GitHub
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'eas.json'

jobs:
  build:
    name: Build APK (preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Print download URL
        run: echo "✅ Build complete! Download your APK from https://expo.dev/accounts/jiggyasa-dev/projects/nutritrack/builds"
